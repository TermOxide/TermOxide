name: Update PR Codecov Review

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: "PR number to refresh the Codecov section for"
        required: true

concurrency:
  group: codecov-review-${{ github.event.check_run.head_sha || github.event.inputs.pull_number }}

jobs:
  update-codecov-section:
    runs-on: ubuntu-latest
    # check_run has no trigger-level filter, so restrict to Codecov's own app here.
    if: github.event_name == 'workflow_dispatch' || github.event.check_run.app.slug == 'codecov'
    permissions:
      pull-requests: write
      issues: write
      checks: read
    steps:
      - name: Update Codecov section and post indicator review
        uses: actions/github-script@v9
        env:
          INPUT_PULL_NUMBER: ${{ github.event.inputs.pull_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const MARKER        = '<!-- pr-quality-bot -->';
            const CODECOV_START = '<!-- codecov-section-start -->';
            const CODECOV_END   = '<!-- codecov-section-end -->';
            const CODECOV_CTXS  = ['codecov/project', 'codecov/patch'];

            // -- Resolve the target PR and commit SHA --------------------------
            // workflow_dispatch already names the PR directly; check_run only
            // gives us a commit, so look up which open PR it belongs to.
            let sha;
            let pull_number;

            if (context.eventName === 'workflow_dispatch') {
              pull_number = parseInt(process.env.INPUT_PULL_NUMBER, 10);

              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              sha = pr.head.sha;
            } else {
              sha = context.payload.check_run.head_sha;

              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });

              const pr = prs.find(p => p.state === 'open');

              if (!pr) {
                core.info(`No open PR for SHA ${sha}`);
                return;
              }

              pull_number = pr.number;
            }

            // -- Find the comment ---------------------------------------
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });

            const existing = comments
              .filter(c => c.user.type === 'Bot' && c.body?.includes(MARKER))
              .reverse()[0];

            if (!existing) {
              core.info('No bot comment found; skipping Codecov update.');
              return;
            }

            // -- Fetch Codecov check runs -------------------------------------
            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
            });

            const codecov = checks.check_runs.filter(c =>
              CODECOV_CTXS.includes(c.name)
            );

            // Render each context independently instead of waiting for both:
            // codecov/project can stay unavailable indefinitely on non-default
            // branches, and blocking on it left the section stuck forever.
            const fmt = name => {
              const c = codecov.find(x => x.name === name);
              if (!c) return `⏳ \`${name}\` _(not yet reported)_`;
              if (c.status !== 'completed') return `⏳ \`${name}\` _(running)_`;

              const icon = c.conclusion === 'success' ? '✅' : '❌';
              return `${icon} \`${name}\``;
            };

            const errors = codecov
              .filter(c => c.conclusion === 'failure')
              .map(c => `- \`${c.name}\`: ${c.output?.summary || 'Failed'}`)
              .join('\n');

            const newSection = [
              CODECOV_START,
              '## 📊 Codecov',
              '',
              '### Requirements',
              '',
              fmt('codecov/project'),
              fmt('codecov/patch'),
              '',
              '### Errors',
              '',
              errors || '_No errors_',
              CODECOV_END,
            ].join('\n');

            // -- Splice updated section into existing comment body ------------
            const start = existing.body.indexOf(CODECOV_START);
            const end   = existing.body.indexOf(CODECOV_END);

            if (start === -1 || end === -1) {
              core.warning('Codecov section markers not found in comment; skipping.');
              return;
            }

            const updated =
              existing.body.slice(0, start) +
              newSection +
              existing.body.slice(end + CODECOV_END.length);

            // -- Recompute overall header icon --------------------------------
            // Strip HTML comments before scanning for icons so markers don't interfere.
            const bodyText = updated.replace(/<!--[\s\S]*?-->/g, '');
            const ok = !bodyText.includes('❌');

            const finalBody = updated.replace(
              /^# [⏳✅❌] PR Validation Status/m,
              `# ${ok ? '✅' : '❌'} PR Validation Status`
            );

            // -- Update comment in-place -------------------------------
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body: finalBody,
            });
            core.info(`Updated comment #${existing.id} with Codecov results`);

            // -- Dismiss previous indicator review if any ---------------------
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number,
            });

            const previousReview = reviews
              .filter(r =>
                r.user.login === 'github-actions[bot]' &&
                (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED')
              )
              .reverse()[0];

            if (previousReview) {
              await github.rest.pulls.dismissReview({
                owner,
                repo,
                pull_number,
                review_id: previousReview.id,
                message: 'Superseded by updated Codecov results.',
              });
              core.info(`Dismissed previous indicator review #${previousReview.id}`);
            }

            // -- Post new indicator review ------------------------------------
            const event = ok ? 'APPROVE' : 'REQUEST_CHANGES';

            const reviewParams = {
              owner,
              repo,
              pull_number,
              event,
            };

            if (event === 'REQUEST_CHANGES') {
              reviewParams.body = `See the [quality report](${existing.html_url}) for details.`;
            }

            await github.rest.pulls.createReview(reviewParams);
            core.info(`Posted indicator review: ${event}`);

name: Update PR Codecov Review

on:
  workflow_run:
    workflows: ["pr-validator"]
    types: [completed]

jobs:
  update-codecov-section:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      checks: read
    steps:
      - name: Update Codecov section and post indicator review
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const run = context.payload.workflow_run;
            const sha = run.head_sha;

            const MARKER        = '<!-- pr-quality-bot -->';
            const CODECOV_START = '<!-- codecov-section-start -->';
            const CODECOV_END   = '<!-- codecov-section-end -->';
            const CODECOV_CTXS  = ['codecov/project', 'codecov/patch'];

            // -- Find the open PR for this SHA ---------------------------------
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: sha,
            });

            const pr = prs.find(p => p.state === 'open');

            if (!pr) {
              core.info(`No open PR for SHA ${sha}`);
              return;
            }

            const pull_number = pr.number;

            // -- Find the comment ---------------------------------------
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });

            const existing = comments
              .filter(c => c.user.type === 'Bot' && c.body?.includes(MARKER))
              .reverse()[0];

            if (!existing) {
              core.info('No bot comment found; skipping Codecov update.');
              return;
            }

            // -- Fetch Codecov check runs -------------------------------------
            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
            });

            const codecov = checks.check_runs.filter(c =>
              CODECOV_CTXS.includes(c.name)
            );

            if (!codecov.length) {
              core.info('No Codecov check runs found yet');
              return;
            }

            const pending = codecov.some(c => c.status !== 'completed');
            if (pending) {
              core.info('Codecov checks still running; will re-evaluate later.');
              return;
            }

            // -- Build updated Codecov section --------------------------------
            const fmt = name => {
              const c = codecov.find(x => x.name === name);
              if (!c) return `⚠️ \`${name}\``;

              const icon =
                c.conclusion === 'success' ? '✅' :
                c.conclusion === 'failure' ? '❌' :
                '⏳';

              return `${icon} \`${name}\``;
            };

            const errors = codecov
              .filter(c => c.conclusion === 'failure')
              .map(c => `- \`${c.name}\`: ${c.output?.summary || 'Failed'}`)
              .join('\n');

            const newSection = [
              CODECOV_START,
              '## 📊 Codecov',
              '',
              '### Requirements',
              '',
              fmt('codecov/project'),
              fmt('codecov/patch'),
              '',
              '### Errors',
              '',
              errors || '_No errors_',
              CODECOV_END,
            ].join('\n');

            // -- Splice updated section into existing comment body ------------
            const start = existing.body.indexOf(CODECOV_START);
            const end   = existing.body.indexOf(CODECOV_END);

            if (start === -1 || end === -1) {
              core.warning('Codecov section markers not found in comment; skipping.');
              return;
            }

            const updated =
              existing.body.slice(0, start) +
              newSection +
              existing.body.slice(end + CODECOV_END.length);

            // -- Recompute overall header icon --------------------------------
            // Strip HTML comments before scanning for icons so markers don't interfere.
            const bodyText = updated.replace(/<!--[\s\S]*?-->/g, '');
            const ok = !bodyText.includes('❌');

            const finalBody = updated.replace(
              /^# [⏳✅❌] PR Validation Status/m,
              `# ${ok ? '✅' : '❌'} PR Validation Status`
            );

            // -- Update comment in-place -------------------------------
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body: finalBody,
            });
            core.info(`Updated comment #${existing.id} with Codecov results`);

            // -- Dismiss previous indicator review if any ---------------------
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number,
            });

            const previousReview = reviews
              .filter(r =>
                r.user.login === 'github-actions[bot]' &&
                (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED')
              )
              .reverse()[0];

            if (previousReview) {
              await github.rest.pulls.dismissReview({
                owner,
                repo,
                pull_number,
                review_id: previousReview.id,
                message: 'Superseded by updated Codecov results.',
              });
              core.info(`Dismissed previous indicator review #${previousReview.id}`);
            }

            // -- Post new indicator review ------------------------------------
            const event = ok ? 'APPROVE' : 'REQUEST_CHANGES';

            const reviewParams = {
              owner,
              repo,
              pull_number,
              event,
            };

            if (event === 'REQUEST_CHANGES') {
              reviewParams.body = `See the [quality report](${existing.html_url}) for details.`;
            }

            await github.rest.pulls.createReview(reviewParams);
            core.info(`Posted indicator review: ${event}`);

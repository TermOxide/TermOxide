name: Bump workspace crate versions

on:
  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump type"
        required: true
        type: choice
        options: [major, minor, patch]
      crates:
        description: "Comma-separated crate names to force bump (e.g. crate1,crate2). Leave empty to auto-detect."
        required: false
        type: string
      dry_run:
        description: "Publish in dry-run mode: package and build the bumped crates, don't upload"
        required: false
        type: boolean
        default: false

# Each run bumps from the tip of the branch, so two overlapping runs would
# bump and tag the same changes.
concurrency:
  group: crates-bumper
  cancel-in-progress: false
  queue: max

jobs:
  setup-bumper:
    name: Setup Rust & Cache
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          persist-credentials: false

      - name: Setup Rust & push cache
        uses: ./.github/actions/rust-cache
        with:
          action: push
          packages: '["cargo-workspaces"]'

  run-bumper:
    name: Bump versions
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: setup-bumper
    outputs:
      crates: ${{ steps.push.outputs.crates }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          # For PR merge events, checkout the base branch (main/master) so:
          #   - cargo workspaces can walk the tag history correctly for auto-detection
          #   - the bump commit lands on the right branch
          # For workflow_dispatch, github.ref_name is the dispatched branch.
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}

      - name: Restore Rust cache
        uses: ./.github/actions/rust-cache
        with:
          action: pull
          packages: '["cargo-workspaces"]'

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Resolve release type
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_TYPE: ${{ inputs.release_type }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          RELEASE_TYPE=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TYPE="$DISPATCH_RELEASE_TYPE"
          else
            while IFS= read -r label; do
              if [[ "$label" =~ ^[0-9]+\.release:\ (major|minor|patch)$ ]]; then
                RELEASE_TYPE="${BASH_REMATCH[1]}"
                break
              fi
            done < <(echo "$PR_LABELS_JSON" | jq -r '.[].name')
          fi

          if [[ -z "$RELEASE_TYPE" ]]; then
            echo "::notice::No release label found - skipping version bump"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

      # The bump starts from the tip of the branch: a merge that landed after
      # this PR's would be released under this PR's label.
      - name: Check the branch tip is this PR's merge
        if: steps.release.outputs.skip != 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! git merge-base --is-ancestor "$MERGE_SHA" HEAD; then
            echo "::error::#${PR_NUMBER}'s merge commit ${MERGE_SHA} is not on $(git branch --show-current)"
            exit 1
          fi

          # Only earlier runs' bump commits may sit on top of the merge.
          later=$(git log --format='%H %an %s' "${MERGE_SHA}..HEAD" \
            | grep -v ' github-actions chore: bump workspace crate versions \[skip ci\]$' || true)
          if [[ -n "$later" ]]; then
            echo "::error::Commits merged after #${PR_NUMBER} would be released under its label. Bump them with a manual dispatch instead:"
            echo "$later"
            exit 1
          fi

      - name: Resolve force pattern
        id: force
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CRATES: ${{ inputs.crates }}
        run: |
          FORCE_ARG=""

          # Only force on dispatch with explicit crates. PR events rely on
          # `cargo workspaces version` own change detection (tag-based diff).
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_CRATES" ]]; then
            # Normalise: strip whitespace around commas so "crate1, crate2" works
            NORMALISED=$(echo "$DISPATCH_CRATES" | tr ',' '\n' | xargs | tr ' ' ',')
            CRATE_COUNT=$(echo "$NORMALISED" | tr ',' '\n' | grep -c .)
            if [[ "$CRATE_COUNT" -eq 1 ]]; then
              FORCE_ARG="--force ${NORMALISED}"
            else
              PATTERN=$(echo "$NORMALISED" | tr ',' '\n' | paste -sd',' | sed 's/.*/{&}/')
              FORCE_ARG="--force ${PATTERN}"
            fi
          fi

          echo "force_arg=$FORCE_ARG" >> "$GITHUB_OUTPUT"

      - name: Snapshot workspace versions
        id: snapshot
        if: steps.release.outputs.skip != 'true'
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name)=\(.version)"' | sort)
          {
            echo "before<<EOF"
            echo "$versions"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump versions
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
          FORCE_ARG: ${{ steps.force.outputs.force_arg }}
        run: |
          # --allow-branch, --no-git-push and --no-*-tags are all incompatible with --no-git-commit
          # since they are only relevant when letting cargo-workspaces handle git operations.
          # We handle git ourselves to support commit conventions and individual tagging.
          read -ra force_args <<<"$FORCE_ARG"

          # Without a release tag, cargo-workspaces sees every crate as changed
          # and the publish job would upload all of them.
          if [[ ${#force_args[@]} -eq 0 && -z "$(git tag --list '*@*')" ]]; then
            echo "::error::No crate@version tag found. Tag each crate at its current version on this branch before the first release."
            exit 1
          fi

          cargo workspaces version \
            --no-git-commit \
            --yes \
            "${force_args[@]}" \
            "$RELEASE_TYPE"

      - name: Resolve bumped crates
        id: bumped
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          BEFORE: ${{ steps.snapshot.outputs.before }}
        run: |
          after=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name)=\(.version)"' | sort)

          # Lines present only in $after are packages whose version was bumped.
          # comm -13 suppresses lines unique to file1 and lines common to both,
          # leaving only lines unique to file2 (i.e. the new name=version entries).
          crates=$(comm -13 <(echo "$BEFORE") <(echo "$after") | cut -d= -f1)

          {
            echo "crates<<EOF"
            echo "$crates"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit, tag & push
        id: push
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          BUMPED_CRATES: ${{ steps.bumped.outputs.crates }}
        run: |
          if git diff --quiet; then
            echo "::notice::cargo workspaces reported no changed crates - nothing to commit"
            exit 0
          fi

          if [[ -z "$BUMPED_CRATES" ]]; then
            echo "::error::Cargo.toml files changed but BUMPED_CRATES is empty - version snapshot diff failed"
            exit 1
          fi

          git add -A

          # Build commit message with bumped crate list
          {
            echo "chore: bump workspace crate versions [skip ci]"
            echo ""
            echo "### Bumped crates"
            echo ""
            echo "$BUMPED_CRATES" | while read -r crate; do
              echo "- \`$crate\`"
            done
          } | git commit -F -

          # Tag each bumped crate (format: crate-name@x.y.z)
          # Matches cargo-workspaces default individual tag format (%n@%v)
          tags=()
          while read -r crate; do
            [[ -z "$crate" ]] && continue # Skip empty lines
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" \
                '.packages[] | select(.name == $name) | .version')
            echo "Tagging ${crate}@${version}"
            git tag "${crate}@${version}"
            tags+=("refs/tags/${crate}@${version}")
          done <<<"$BUMPED_CRATES"

          # A bump commit pushed without its tags would be bumped again on a
          # rerun, since the version diff starts from the last tag.
          git push --atomic origin HEAD "${tags[@]}"

          echo "crates=$(echo "$BUMPED_CRATES" | xargs)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so the publish
  # is chained here instead of listening for the tags.
  publish:
    name: Publish to crates.io
    needs: run-bumper
    if: needs.run-bumper.outputs.crates != ''
    permissions:
      contents: read
    uses: ./.github/workflows/crates-publish.yaml
    with:
      crates: ${{ needs.run-bumper.outputs.crates }}
      ref: ${{ needs.run-bumper.outputs.sha }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

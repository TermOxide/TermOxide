name: "Rust Cache"
description: "Setup Rust toolchain and cache cargo artifacts"

inputs:
  action:
    description: "Cache action: 'push' (setup + build + save cache) or 'pull' (restore cache only)"
    required: true
  toolchain:
    description: "Rust toolchain to install (e.g. 'stable', 'nightly', '1.89.0', 'nightly-2025-01-01')"
    required: false
    default: "stable"
  components:
    description: 'JSON array of additional toolchain components to install (e.g. ''["rustfmt", "clippy"]'')'
    required: false
    default: "[]"
  packages:
    description: 'JSON array of crates.io packages to install (e.g. ''["cargo-workspaces"]'')'
    required: false
    default: "[]"
  crates:
    description: 'JSON array of local workspace crates to build (e.g. ''["cargo-extract"]'')'
    required: false
    default: "[]"

outputs:
  cache-hit:
    description: "Whether the cache was hit"
    value: ${{ steps.cache-push.outputs.cache-hit || steps.cache-pull.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Compute cache key
      id: cache-key
      shell: bash
      run: |
        hash=$(echo '${{ inputs.packages }}${{ inputs.crates }}${{ inputs.components }}' | sha256sum | cut -d ' ' -f1)
        prefix="${{ runner.os }}-cargo-${{ inputs.toolchain }}-${hash}"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}-${{ hashFiles('**/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

    - name: Convert components to comma-separated string
      id: components
      shell: bash
      run: |
        echo "components=$(echo '${{ inputs.components }}' | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"

    - name: Restore & save cargo cache
      if: inputs.action == 'push'
      id: cache-push
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          ~/.rustup
          target/
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.cache-key.outputs.prefix }}-

    - name: Restore cargo cache
      if: inputs.action == 'pull'
      id: cache-pull
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          ~/.rustup
          target/
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.cache-key.outputs.prefix }}-

    - name: Setup Rust toolchain
      if: inputs.action == 'push' && steps.cache-push.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # Pinned to avoid volatile tag, this is the latest commit as of 05/06/2026
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ steps.components.outputs.components }}

    - name: Install cargo packages
      if: inputs.action == 'push' && steps.cache-push.outputs.cache-hit != 'true'
      shell: bash
      run: |
        packages='${{ inputs.packages }}'
        for pkg in $(echo "$packages" | jq -r '.[]'); do
          echo "::group::Installing ${pkg}"
          cargo install "$pkg" --locked
          echo "::endgroup::"
        done

    - name: Build local crates
      if: inputs.action == 'push' && steps.cache-push.outputs.cache-hit != 'true'
      shell: bash
      run: |
        crates='${{ inputs.crates }}'
        for crate in $(echo "$crates" | jq -r '.[]'); do
          echo "::group::Building ${crate}"
          cargo build --release -p "$crate"
          echo "::endgroup::"
        done

    - name: Add cargo bin to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

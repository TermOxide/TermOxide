[package]
name = "termoxide_macros"
description = "Procedural macros for TermOxide"
version = "1.0.0-alpha"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[package.metadata.workspaces]
independent = true

[package]
name = "termoxide_event"
version = "0.1.0"
edition = "2024"
description = "Event system for TermOxide"
license = "BSD-2-Clause"

[dependencies]
crossterm = { version = "0.27", optional = true }

[features]
default = ["terminal"]
# The reader thread on the real terminal. Without it, only the event types
# remain, which is what an app built for wasm needs.
terminal = ["dep:crossterm"]

[dev-dependencies]
serial_test = "3"

[lints]
workspace = true

[package]
name = "termoxide_rendering"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reactive rendering pipeline for TermOxide: ViewNode tree, render loop, buffer diffing, and event routing"

[dependencies]
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = "0.27"
termoxide_event = { version = "0.1.0", path = "../termoxide_event" }
termoxide_layout = { version = "0.1.0", path = "../termoxide_layout" }
termoxide_reactive = { version = "0.1.0", path = "../termoxide_reactive" }

[features]
default = []
# Exposes `Renderer::new_for_test` to other crates' tests.
test-util = []

[package.metadata.workspaces]
independent = true

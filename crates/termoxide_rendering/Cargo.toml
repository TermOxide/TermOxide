[package]
name = "termoxide_rendering"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reactive rendering pipeline for TermOxide: ViewNode tree, render loop, buffer diffing, and event routing"

[dependencies]
ratatui = { version = "0.26", default-features = false }
crossterm = { version = "0.27", optional = true }
termoxide_event = { version = "0.1.0", path = "../termoxide_event", default-features = false }
termoxide_layout = { version = "0.1.0", path = "../termoxide_layout" }
termoxide_reactive = { version = "0.1.0", path = "../termoxide_reactive" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["terminal"]
# The renderer. Without it, only the view tree and its helpers remain.
terminal = ["dep:crossterm", "ratatui/crossterm", "ratatui/underline-color", "termoxide_event/terminal"]
# Exposes `Renderer::new_for_test` to other crates' tests.
test-util = ["terminal"]
# Views as bytes, to cross a process or wasm boundary.
serde = ["dep:serde", "ratatui/serde", "termoxide_layout/ratatui", "termoxide_layout/serde"]

[dev-dependencies]
termoxide_rendering = { path = ".", features = ["serde"] }
postcard = { version = "1", features = ["use-std"] }

[lints]
workspace = true

[package.metadata.workspaces]
independent = true

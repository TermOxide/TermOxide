[package]
name = "termoxide_rendering"
version = "0.1.0"
edition = "2024"
description = "Reactive rendering pipeline for TermOxide: ViewNode tree, render loop, buffer diffing, and event routing"

[dependencies]
ratatui = { version = "0.26", default-features = false }
crossterm = { version = "0.27", optional = true }
termoxide_event = { path = "../termoxide_event", default-features = false }
termoxide_layout = { path = "../termoxide_layout" }
termoxide_reactive = { path = "../termoxide_reactive" }

[features]
default = ["terminal"]
# The renderer. Without it, only the view tree and its helpers remain.
terminal = ["dep:crossterm", "ratatui/crossterm", "ratatui/underline-color", "termoxide_event/terminal"]
# Exposes `Renderer::new_for_test` to other crates' tests.
test-util = ["terminal"]

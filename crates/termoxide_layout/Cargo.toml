[package]
name = "termoxide_layout"
description = "Layout primitives for TermOxide"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui = { version = "0.26", optional = true, features = ["crossterm"] }
taffy = { version = "0.9.2", optional = true }

[features]
# Planned for Rdmp1 only — features beyond the epic #12 scope live behind this
# flag. See lib.rs for the exact list.
future = ["dep:taffy"]
ratatui = ["dep:ratatui"]

[package.metadata.workspaces]
independent = true

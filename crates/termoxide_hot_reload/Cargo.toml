[package]
name = "termoxide_hot_reload"
version = "0.1.0"
edition = "2024"
description = "Hot reload for TermOxide apps during development"
license = "BSD-2-Clause"

[dependencies]
color-eyre = "0.6"
interprocess = "2.4.4"
log = { version = "0.4", features = ["std"] }
dirs = "7.0"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = { version = "0.26", default-features = false }
reactive_graph = { version = "0.2", features = ["effects"] }
serde = { version = "1.0.229", features = ["derive"] }
termoxide = { path = "../termoxide" }
termoxide_event = { path = "../termoxide_event", features = ["serde"] }
termoxide_reactive = { path = "../termoxide_reactive", features = ["serde"] }
termoxide_rendering = { path = "../termoxide_rendering", features = ["serde"] }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
# `yield_now`, so the app's render effect runs before its reply is sent.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
any_spawner = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true

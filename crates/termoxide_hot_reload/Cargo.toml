[package]
name = "termoxide_hot_reload"
version = "0.1.0"
edition = "2024"
description = "Hot reload for TermOxide apps during development"
license = "BSD-2-Clause"

[dependencies]
color-eyre = "0.6"
interprocess = "2.4.4"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
termoxide = { path = "../termoxide" }

[lints]
workspace = true

[package]
name = "termoxide_hot_reload"
version = "0.1.0"
edition = "2024"
description = "Hot reload for TermOxide apps during development"
license = "BSD-2-Clause"

# Shared by both sides: the messages and what they carry.
[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = { version = "0.26", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
termoxide = { path = "../termoxide", default-features = false }
termoxide_event = { path = "../termoxide_event", default-features = false, features = ["serde"] }
termoxide_reactive = { path = "../termoxide_reactive", features = ["serde"] }
termoxide_rendering = { path = "../termoxide_rendering", default-features = false, features = ["serde"] }

color-eyre = { version = "0.6", optional = true }
dirs = { version = "7.0", optional = true }
interprocess = { version = "2.4.4", optional = true }
log = { version = "0.4", features = ["std"], optional = true }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"], optional = true }

reactive_graph = { version = "0.2", features = ["effects"], optional = true }
# `yield_now`, so the app's render effect runs before its reply is sent.
tokio = { version = "1", features = ["rt"], optional = true }

[features]
# The native side: the process that owns the terminal, and the subprocess it
# spawns and talks to over the pipe.
host = ["dep:color-eyre", "dep:dirs", "dep:interprocess", "dep:log", "dep:time", "termoxide/terminal"]
# The app's side: what runs the app and answers the host's requests.
guest = ["dep:reactive_graph", "dep:tokio"]

[dev-dependencies]
termoxide_hot_reload = { path = ".", features = ["host", "guest"] }
any_spawner = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true

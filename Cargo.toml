[workspace]
resolver = "3" # Setup cargo to use latest resolver for workspaces
members = [
    "crates/termoxide",
    "crates/oxidui_style",
    "crates/termoxide_macros",
    "crates/termoxide_reactive",
    "crates/cargo-extract",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Clippy lints configuration
[workspace.lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "deny", priority = -2 }

complexity = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -2 }
style = { level = "warn", priority = -2 }

unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
panic = { level = "warn", priority = -1 }
todo = { level = "warn", priority = -1 }
unimplemented = { level = "warn", priority = -1 }

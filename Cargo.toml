[workspace]
members = [
    "crates/termoxide",
    "crates/termoxide_macros",
    "crates/termoxide_reactive",
    "crates/termoxide_layout",
]

[dependencies]
oxidui_macros = { path = "crates/oxidui_macros" }
oxidui_style = { path = "crates/oxidui_style", default-features = true }

# Path handling
walkdir = "2.5"
dirs = "6.0"

# Watcher
notify = "8.2"
crossbeam-channel = "0.5"

# utilities
enum_cycling = "0.2.1"

[features]
default = ["ratatui"]
ratatui = ["oxidui_style/ratatui"]
members = [
    "crates/termoxide",
    "crates/termoxide_macros",
    "crates/termoxide_reactive",
    "crates/termoxide_layout",
    "crates/termoxide_event",
    "crates/cargo-extract",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Clippy lints configuration
[workspace.lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "deny", priority = -2 }

complexity = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -2 }
style = { level = "warn", priority = -2 }

unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
panic = { level = "warn", priority = -1 }
todo = { level = "warn", priority = -1 }
unimplemented = { level = "warn", priority = -1 }

[workspace]
resolver = "3" # Setup cargo to use latest resolver for workspaces
members = [
    "crates/termoxide",
    "crates/termoxide_macros",
    "crates/termoxide_reactive",
    "crates/termoxide_layout",
    "crates/termoxide_event",
    "crates/termoxide_rendering",
    "crates/termoxide_e2e",
    "crates/termoxide_hot_reload",
    "crates/termoxide_hot_reload_macros",
    "crates/termoxide_cli",
    "crates/cargo-extract",
]

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/TermOxide/TermOxide"

# Optimized builds without excessive compilation times.
# Thin LTO retains cross-crate optimizations while allowing more
# parallelism during code generation.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Distribution builds prioritize runtime performance and binary size
# over compilation time. Nix can reuse these expensive builds through
# its binary cache, avoiding repeated compilation for consumers.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Clippy lints configuration
[workspace.lints.rust]
# Set by cargo-tarpaulin, whose runs leave out the tests that spawn processes:
# traced with `--follow-exec`, those processes crash.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)"] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "deny", priority = -2 }

complexity = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -2 }
style = { level = "warn", priority = -2 }

unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
panic = { level = "warn", priority = -1 }
todo = { level = "warn", priority = -1 }
unimplemented = { level = "warn", priority = -1 }
